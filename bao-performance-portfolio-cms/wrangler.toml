# Portfolio V2 - Development Environment
name = "portfolio"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/"]

[[d1_databases]]
binding = "DB"
database_name = "bao-portfolio-v2-db"
database_id = "f8fe22fc-cf81-464d-a286-52bb1bc3cccd"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bao-portfolio-v2-media"
